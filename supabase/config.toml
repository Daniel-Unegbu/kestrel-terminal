# The app authenticates Edge Function calls with the publishable key on the
# `apikey` header. Publishable/secret keys are not JWTs, so the platform JWT
# check is disabled and each function validates the apikey itself.
[functions.research-entity]
verify_jwt = false

[functions.voice-brief]
verify_jwt = false

[functions.dealdesk-qa]
